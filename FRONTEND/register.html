<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Local Service Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="register.css">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Join Local Service Finder 🚀</h1>

        <p>
            Create your account and discover trusted local professionals near you.
        </p>

    </div>

    <div class="right">

        <div class="register-card">

            <h2>Create Account</h2>

            <form id="registerForm">

                <div class="inputBox">
                    <label>Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter Name"
                        required>
                </div>

                <div class="inputBox">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>
                </div>

                <div class="inputBox">

                    <label>Password</label>

                    <div class="passwordBox">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">

                            👁

                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="registerBtn">

                    Register

                </button>

                <p class="login">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

                <div id="message"></div>

            </form>

        </div>

    </div>

</div>

<script src="register.js"></script>

</body>

</html>
