<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Local Service Finder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>Welcome Back 👋</h1>

<p>

Login to continue booking trusted professionals near you.

</p>

<img src="https://undraw.co/api/illustrations/0b9b65a6-88dc-4cf7-a0dc-58d67d53d1b2" alt="">

</div>

<div class="right">

<div class="login-card">

<h2>Login</h2>

<form id="loginForm">

<div class="inputBox">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="inputBox">

<label>Password</label>

<div class="passwordBox">

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button
type="button"
id="togglePassword">

👁

</button>

</div>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button
type="submit"
class="loginBtn">

Login

</button>

<p class="register">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

<div id="message"></div>

</form>

</div>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
